<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komunikasi Rumah & HP</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 15px; background: #eef2f5; }
        .card { background: white; max-width: 480px; margin: auto; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { margin-bottom: 5px; color: #333; }
        .role-selector { margin-bottom: 15px; }
        .role-btn { padding: 8px 15px; font-size: 14px; margin: 0 4px; border: 1px solid #007bff; border-radius: 6px; background: #fff; cursor: pointer; }
        .role-active { background: #007bff; color: white; }
        .chat-box { height: 280px; overflow-y: auto; border: 1px solid #e0e0e0; border-radius: 8px; text-align: left; padding: 12px; margin-bottom: 15px; background: #fafafa; }
        .msg { margin: 8px 0; padding: 8px 12px; border-radius: 8px; max-width: 80%; word-wrap: break-word; }
        .msg-hp { background: #dcf8c6; margin-left: auto; text-align: right; }
        .msg-pc { background: #e3f2fd; margin-right: auto; text-align: left; }
        .msg-img { max-width: 100%; border-radius: 8px; margin-top: 5px; }
        textarea { width: 93%; height: 50px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; resize: none; }
        button { padding: 10px 15px; font-size: 14px; font-weight: bold; margin: 4px 2px; border: none; border-radius: 8px; cursor: pointer; }
        .btn-send { background: #28a745; color: white; }
        .btn-mic { background: #007bff; color: white; }
        .btn-img { background: #ff9800; color: white; }
        .btn-clear { background: #dc3545; color: white; margin-top: 10px; width: 95%; }
        #fileInput { display: none; }
    </style>

    <!-- Modul Firebase Realtime Database -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // KONFIGURASI FIREBASE KAMU
        const firebaseConfig = {
            apiKey: "AIzaSyDk9wA1J-wVkDmA_mTeBGHr7ddRS28QMpY",
            authDomain: "project-7328d8f0-f888-4ae1-809.firebaseapp.com",
            databaseURL: "https://project-7328d8f0-f888-4ae1-809-default-rtdb.firebaseio.com",
            projectId: "project-7328d8f0-f888-4ae1-809",
            storageBucket: "project-7328d8f0-f888-4ae1-809.firebasestorage.app",
            messagingSenderId: "676587031700",
            appId: "1:676587031700:web:46343edb093539ab7b7881",
            measurementId: "G-K0L42TXNZL"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const messagesRef = ref(database, 'messages');

        let currentRole = "HP";

        window.setRole = function(role) {
            currentRole = role;
            document.getElementById('btnHP').classList.toggle('role-active', role === 'HP');
            document.getElementById('btnPC').classList.toggle('role-active', role === 'PC');
            alert("Perangkat ini diatur sebagai: " + role);
        };

        // Kirim Teks
        window.sendMessage = function() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            push(messagesRef, {
                sender: currentRole,
                text: text,
                type: 'text',
                isVoiceCommand: false, // Default: bukan perintah suara
                timestamp: Date.now()
            });

            input.value = '';
        };

        // Kirim Gambar (Base64)
        window.uploadImage = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 500;
                    const scaleFactor = MAX_WIDTH / img.width;
                    
                    canvas.width = (img.width > MAX_WIDTH) ? MAX_WIDTH : img.width;
                    canvas.height = (img.width > MAX_WIDTH) ? (img.height * scaleFactor) : img.height;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.6);

                    push(messagesRef, {
                        sender: currentRole,
                        imageUrl: compressedBase64,
                        type: 'image',
                        isVoiceCommand: false,
                        timestamp: Date.now()
                    });
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        // Hapus Semua Pesan
        window.clearChat = function() {
            if (confirm("Apakah Anda yakin ingin menghapus semua riwayat pesan?")) {
                remove(messagesRef)
                    .then(() => {
                        document.getElementById('chatBox').innerHTML = '';
                        alert("Riwayat pesan berhasil dihapus!");
                    })
                    .catch((error) => {
                        alert("Gagal menghapus pesan: " + error.message);
                    });
            }
        };

        // Pantau jika data dihapus
        onValue(messagesRef, (snapshot) => {
            if (!snapshot.exists()) {
                document.getElementById('chatBox').innerHTML = '';
            }
        });

        // Mendengarkan Pesan Masuk secara Realtime
        onChildAdded(messagesRef, (snapshot) => {
            const data = snapshot.val();
            const chatBox = document.getElementById('chatBox');
            
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${data.sender === 'HP' ? 'msg-hp' : 'msg-pc'}`;
            
            if (data.type === 'image') {
                msgDiv.innerHTML = `<b>${data.sender}:</b><br><img src="${data.imageUrl}" class="msg-img" />`;
            } else {
                msgDiv.innerHTML = `<b>${data.sender}:</b> ${data.text}`;
            }

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            // HANYA membacakan suara jika dikirim lewat tombol 🎤 Suara
            if (data.sender !== currentRole && data.isVoiceCommand) {
                speakText(data.text);
            }
        });

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'id-ID';
                utterance.rate = 1;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Fitur 🎤 Suara: Mengirim teks SERTA menandainya untuk DIBACAKAN SUARA
        window.startVoiceRecognition = function() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Browser tidak mendukung pengenalan suara. Gunakan Google Chrome.");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'id-ID';
            recognition.start();

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                if (!transcript) return;

                push(messagesRef, {
                    sender: currentRole,
                    text: transcript,
                    type: 'text',
                    isVoiceCommand: true, // Ditandai agar DIBACAKAN SUARA di perangkat penerima
                    timestamp: Date.now()
                });
            };
        };
    </script>
</head>
<body>

<div class="card">
    <h2>Obrolah Keluarga</h2>
    <div class="role-selector">
        <button id="btnHP" class="role-btn role-active" onclick="setRole('HP')">📱 HP (Ayah)</button>
        <button id="btnPC" class="role-btn" onclick="setRole('PC')">💻 PC (Mamah)</button>
    </div>
    
    <div class="chat-box" id="chatBox"></div>

    <textarea id="messageInput" placeholder="Ketik pesan..."></textarea><br>
    <button class="btn-send" onclick="sendMessage()">Kirim Pesan</button>
    <button class="btn-mic" onclick="startVoiceRecognition()">Kirim Suara</button>
    
    <button class="btn-img" onclick="document.getElementById('fileInput').click()">Kirim Foto</button>
    <input type="file" id="fileInput" accept="image/*" onchange="uploadImage(event)">

    <br>
    <button class="btn-clear" onclick="clearChat()">🗑️ Hapus Semua Riwayat Chat</button>
</div>

</body>
</html>
